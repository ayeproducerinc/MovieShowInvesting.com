  /filmmakers/review-checkout/config:
    get:
      operationId: getPitchReviewCheckoutConfig
      tags: [filmmakers]
      summary: Read payment environment and launch availability without exposing Stripe credentials
      responses:
        "200":
          description: Live checkout stays disabled until owner approval and production configuration
          content:
            application/json:
              schema:
                type: object
                required: [mode, enabled]
                properties:
                  mode: { type: string, enum: [live, sandbox] }
                  enabled: { type: boolean }
  /filmmakers/review-checkout:
    post:
      operationId: startPitchReviewCheckout
      tags: [filmmakers]
      summary: Start pitch-specific review checkout in the explicitly configured environment
      security:
        - firebaseBearer: []
        - {}
      parameters:
        - name: X-MSI-Project-Id
          in: header
          required: false
          schema: { type: integer, minimum: 1 }
        - name: X-MSI-Checkout-Proof
          in: header
          required: false
          description: Short-lived submission proof for this pitch's review checkout when its guest visit cookie is lost.
          schema: { type: string }
      responses:
        "200":
          description: Stripe checkout URL, or already-submitted status
          content:
            application/json:
              schema:
                type: object
                required: [url, already_submitted]
                properties:
                  url: { type: ["string", "null"] }
                  already_submitted: { type: boolean }
        "400": { description: Visitor or completed pitch required }
        "401": { description: Sign-in required for an account-linked pitch }
        "409": { description: Project context changed or pitch ineligible }
        "503": { description: Checkout is gated or live Stripe verification unavailable; free pitch remains saved }
