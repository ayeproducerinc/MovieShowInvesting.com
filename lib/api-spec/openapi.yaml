openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: site
    description: Public site setup and visitor tracking
  - name: progress
    description: Saved flow progress and visitor assignment
  - name: filmmakers
    description: Filmmaker submissions
  - name: projects
    description: Unlisted project pages and showcase requests
  - name: questions
    description: Private filmmaker question relay
  - name: explore
    description: Project discovery and investor matching
  - name: investor
    description: Investor preferences and intent
  - name: messaging
    description: Private investor and filmmaker conversations
  - name: locations
    description: International city and region suggestions
  - name: admin
    description: Firebase-protected administration
paths:
  /filmmakers/drafts/reset:
    get:
      operationId: inspectFilmmakerDraftReset
      tags: [filmmakers]
      responses:
        "200":
          description: Exact unfinished drafts to confirm before clearing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DraftResetPreview" }
        "403": { description: Wrong draft owner }
        "409": { description: Draft has protected dependencies }
    post:
      operationId: resetFilmmakerDrafts
      tags: [filmmakers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DraftResetInput" }
      responses:
        "200":
          description: Drafts cleared and a fresh worksheet selected
          content:
            application/json:
              schema:
                type: object
                required: [cleared]
                properties:
                  cleared: { type: integer }
        "400": { description: Explicit confirmation required }
        "403": { description: Wrong draft owner }
        "409": { description: Draft or browser context changed }
  /admin/unfinished-draft-cleanup:
    post:
      operationId: cleanupUnfinishedDrafts
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DraftCleanupInput" }
      responses:
        "200":
          description: Inventory or result of a confirmed frozen allowlist cleanup
          content:
            application/json:
              schema:
                type: object
                required: [drafts, protected_count, cleared, skipped]
                properties:
                  drafts:
                    type: array
                    items: { $ref: "#/components/schemas/DraftResetSelection" }
                  protected_count: { type: integer }
                  cleared: { type: integer }
                  skipped: { type: integer }
        "400": { description: Invalid confirmation or allowlist }
        "401": { description: Sign in required }
        "403": { description: Administrator required }
        "409": { description: Wrong server environment }
  /referrals/capture:
    post:
      operationId: captureReferral
      tags: [referrals]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReferralCaptureInput" }
      responses:
        "200":
          description: Referral remembered before signup
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferralCaptureResult" }
        "400": { description: Invalid referral code }
        "409": { description: Attribution already finalized }
        "429": { description: Too many attempts }
  /referrals/claim:
    post:
      operationId: claimReferral
      tags: [referrals]
      responses:
        "200":
          description: Register member and finalize attribution
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferralMember" }
        "401": { description: Sign in required }
  /referrals/me:
    get:
      operationId: getMyReferrals
      tags: [referrals]
      responses:
        "200":
          description: Private referral summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferralMember" }
        "401": { description: Sign in required }
  /admin/referrals:
    get:
      operationId: getAdminReferrals
      tags: [referrals]
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        "200":
          description: Private paginated referral ledger
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferralLedger" }
        "403": { description: Administrator required }
  /admin/referrals/{rewardId}/verify:
    post:
      operationId: verifyReferralReward
      tags: [referrals]
      parameters:
        - in: path
          name: rewardId
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Current payment and listing eligibility
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferralReward" }
        "409": { description: Verification unavailable }
  /admin/referrals/{rewardId}/payout:
    post:
      operationId: recordReferralPayout
      tags: [referrals]
      parameters:
        - in: path
          name: rewardId
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReferralPayoutInput" }
      responses:
        "200":
          description: External manual payout recorded; no funds moved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferralReward" }
        "409": { description: Already paid or no longer eligible }
  /participation/age-confirmation:
    get:
      operationId: getAgeConfirmation
      responses:
        "200":
          description: Current account's self-declared age acknowledgment; guests have no account acknowledgment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgeConfirmation"
    post:
      operationId: confirmAge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgeConfirmationInput"
      responses:
        "200":
          description: Dated acknowledgment saved to the verified account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgeConfirmation"
  /question-config:
    get:
      operationId: getQuestionConfig
      tags: [questions]
      summary: Public question form availability
      responses:
        "200":
          description: Current question form configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionConfig"
  /projects/{slug}/questions:
    post:
      operationId: askFilmmaker
      tags: [questions]
      summary: Send a private question to a project's filmmaker
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionInput"
      responses:
        "201":
          description: Question delivered privately
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionSubmission"
        "400": { description: Invalid question }
        "404": { description: Project unavailable }
        "429": { description: Question rate limit reached }
        "503": { description: Question delivery unavailable }
  /filmmakers/projects/{projectId}/questions:
    get:
      operationId: getFilmmakerQuestions
      tags: [questions]
      summary: List account-owned project questions, unanswered first
      security:
        - firebaseBearer: []
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Private questions without asker email addresses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilmmakerQuestions"
        "401": { description: Sign-in required }
        "403": { description: Verified email required }
        "404": { description: Project is not owned by this account }
  /filmmakers/projects/{projectId}/questions/{messageId}/answer:
    post:
      operationId: answerFilmmakerQuestion
      tags: [questions]
      summary: Email a private answer from the signed-in filmmaker
      security:
        - firebaseBearer: []
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: integer, minimum: 1 }
        - in: path
          name: messageId
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionAnswerInput"
      responses:
        "200":
          description: Answer delivered privately
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionAnswerResult"
        "401": { description: Sign-in required }
        "404": { description: Unanswered account-owned question not found }
        "503": { description: Delivery unavailable; question remains unanswered }
  /questions/answer-token:
    post:
      operationId: answerQuestionByToken
      tags: [questions]
      summary: Answer a question using a single-use emailed link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionTokenAnswerInput"
      responses:
        "200":
          description: Answer delivered privately
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionAnswerResult"
        "404": { description: "Link is invalid, expired, or used" }
        "503": { description: Delivery unavailable; question remains unanswered }
  /questions/report-token:
    post:
      operationId: reportQuestionByToken
      tags: [questions]
      summary: Report a private question using a single-use emailed link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionReportInput"
      responses:
        "200":
          description: Question reported to moderation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionReportResult"
        "404": { description: "Link is invalid, expired, or used" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /stats:
    get:
      operationId: getSiteStats
      tags: [site]
      summary: Database-backed home page count
      responses:
        "200":
          description: Current filmmaker total
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteStats"
  /config:
    get:
      operationId: getFirebaseConfig
      tags: [site]
      summary: Public Firebase web configuration
      responses:
        "200":
          description: Configuration available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirebaseConfig"
        "503":
          description: Firebase has not been configured yet
  /locations:
    get:
      operationId: searchLocations
      tags: [locations]
      summary: Search city and region suggestions
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 80
      responses:
        "200":
          description: Matching city and region suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationSearchPayload"
        "400":
          description: Invalid location search query
        "502":
          description: Location provider returned an invalid response
        "503":
          description: Location provider is temporarily unavailable
  /visit:
    post:
      operationId: recordVisit
      tags: [site]
      summary: Persist a visitor and their first campaign attribution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisitInput"
      responses:
        "200":
          description: Existing or new visitor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Visit"
  /price-group:
    get:
      operationId: getPriceGroup
      tags: [progress]
      summary: Assign a visitor once to price-test group A or B
      responses:
        "200":
          description: Persisted assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceGroup"
  /progress/{flow}:
    get:
      operationId: getFlowProgress
      tags: [progress]
      summary: Read the current visitor's saved flow progress
      description: Unlinked visitor progress remains cookie-accessible. A filmmaker visitor linked to Firebase UID requires a verified Bearer token matching that UID.
      security:
        - firebaseBearer: []
        - {}
      parameters:
        - in: path
          name: flow
          required: true
          schema:
            $ref: "#/components/schemas/Flow"
      responses:
        "200":
          description: Saved progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowProgress"
        "404":
          description: No progress saved
        "401":
          description: Verified sign-in required for an account-linked filmmaker visitor
        "403":
          description: Firebase UID does not own this visitor
        "503":
          description: Firebase verification is unavailable
  /progress:
    post:
      operationId: saveFlowProgress
      tags: [progress]
      summary: Save visitor or account-scoped in-progress answers
      description: Unlinked visitor progress remains cookie-accessible. Investor progress under a verified account is stored separately from guest progress. A filmmaker visitor linked to Firebase UID requires a matching verified Bearer token.
      security:
        - firebaseBearer: []
        - {}
      parameters:
        - name: X-MSI-Draft-Id
          in: header
          required: false
          description: Required for account-linked filmmaker visitors; must match the current filmmaker flow_progress.id.
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveProgressInput"
      responses:
        "200":
          description: Saved progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowProgress"
        "400":
          description: Invalid input or missing visitor
        "401":
          description: Verified sign-in required for an account-linked filmmaker visitor
        "403":
          description: Firebase UID does not own this visitor
        "503":
          description: Firebase verification is unavailable
        "409":
          description: Draft context header is missing or does not match the current draft
  /filmmakers:
    post:
      operationId: submitFilmmaker
      tags: [filmmakers]
      summary: Submit the filmmaker flow
      description: Unlinked guest submissions remain cookie-accessible. A visitor linked to Firebase UID requires a verified Bearer token matching that UID. Honeypot and rate limits always apply. A completed project receives a short-lived proof scoped only to its review checkout and status.
      security:
        - firebaseBearer: []
        - {}
      parameters:
        - name: X-MSI-Draft-Id
          in: header
          required: false
          description: Required for account-linked visitors; must match the current filmmaker flow_progress.id.
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FilmmakerSubmissionInput"
      responses:
        "201":
          description: Filmmaker submission created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilmmakerSubmission"
        "400":
          description: Invalid submission, missing visitor, or linked visitor contact email does not match its verified account email
        "401":
          description: Verified sign-in required for an account-linked visitor
        "403":
          description: Firebase UID does not own this visitor
        "503":
          description: Firebase verification or rate limiting is unavailable
        "409":
          description: Draft context header is missing or does not match the current draft
        "429":
          description: Too many submissions from this visitor or network in the past hour
  /filmmaker-submission-config:
    get:
      operationId: getFilmmakerSubmissionConfig
      tags: [filmmakers]
      summary: Read filmmaker final-submission availability
      responses:
        "200":
          description: Submission availability independent of any deferred challenge service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilmmakerSubmissionConfig"
  /filmmakers/result:
    get:
      operationId: getFilmmakerResult
      tags: [filmmakers]
      summary: Read the current visitor's completed filmmaker result
      description: Unlinked guest results remain cookie-accessible. An account-linked visitor requires a verified Bearer token matching its Firebase UID.
      security:
        - firebaseBearer: []
        - {}
      responses:
        "200":
          description: Completed submission result, including a no-project result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilmmakerResult"
        "404":
          description: No completed filmmaker submission for this visitor
        "401":
          description: Verified sign-in required for an account-linked visitor
        "403":
          description: Firebase UID does not own this visitor
        "503":
          description: Firebase verification is unavailable
  /filmmakers/community/join:
    post:
      operationId: joinFilmmakerCommunity
      tags: [filmmaker]
      summary: Register verified homepage sign-in once and reconcile original-browser work
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FilmmakerCommunityInput"
      responses:
        "200":
          description: Verified account joined; count reflects deduplicated known identities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilmmakerCommunityResult"
        "400":
          description: Invalid input or missing original-browser draft context
        "401":
          description: Verified sign-in required
        "403":
          description: Browser work belongs to another account
        "409":
          description: Browser draft cannot be safely connected
  /filmmakers/projects:
    get:
      operationId: getFilmmakerProjects
      tags: [filmmakers]
      summary: List projects and draft state for the signed-in filmmaker
      description: Requires a verified Firebase account token. Project ownership is based on linked Firebase UID, never the submitted email alone.
      security:
        - firebaseBearer: []
      responses:
        "200":
          description: Account-owned projects and whether an active draft can be resumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilmmakerProjects"
        "401":
          description: Verified sign-in required
        "403":
          description: Firebase email must be verified
        "503":
          description: Firebase verification is unavailable
  /filmmakers/interest-alerts:
    get:
      operationId: getFilmmakerInterestAlerts
      tags: [filmmakers]
      summary: List private confirmed non-binding interest alerts for account-owned projects
      security:
        - firebaseBearer: []
      responses:
        "200":
          description: Owner-scoped alerts, without investor details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilmmakerInterestAlerts"
        "401": { description: Verified sign-in required }
  /filmmakers/interest-alerts/{alertId}/read:
    post:
      operationId: readFilmmakerInterestAlert
      tags: [filmmakers]
      summary: Mark an account-owned interest alert as read
      security:
        - firebaseBearer: []
      parameters:
        - in: path
          name: alertId
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Alert marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilmmakerInterestAlert"
        "401": { description: Verified sign-in required }
        "404": { description: Alert not owned by this account }
  /filmmakers/phone-verification:
    post:
      operationId: verifyFilmmakerPhone
      tags: [filmmakers]
      summary: Synchronize or revoke the signed-in filmmaker's Firebase phone verification
      description: Requires a verified Firebase email. Saves the phone_number claim decoded from the refreshed Firebase ID token across every filmmaker record attached to this UID, or clears phoneVerified for every record when the current token has no phone_number claim.
      security:
        - firebaseBearer: []
      responses:
        "200":
          description: Current Firebase phone verification synchronized or revoked for the filmmaker account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilmmakerPhoneVerification"
        "401":
          description: Verified sign-in required
        "503":
          description: Firebase verification is unavailable
  /filmmakers/projects/claim:
    post:
      operationId: claimFilmmakerProject
      tags: [filmmakers]
      summary: Link the current visitor draft or legacy submission to a verified account
      description: Requires the current visitor cookie. An unfinished draft claim requires X-MSI-Draft-Id to match the current locked filmmaker flow_progress row. A completed legacy submission can still be claimed without that header if its stored email matches the verified account email and it is not linked to another account. A non-empty unlinked guest draft cannot be claimed while a different active draft exists for the account; the guest cookie and answers are preserved on conflict.
      security:
        - firebaseBearer: []
      parameters:
        - name: X-MSI-Draft-Id
          in: header
          required: false
          description: Required when claiming an unfinished filmmaker draft; omitted for legacy completed-submission claims.
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Current draft or submission is linked to this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilmmakerProjectClaim"
        "400":
          description: A recorded visitor cookie is required
        "401":
          description: Verified sign-in required
        "403":
          description: Verified email does not match the submission or visitor belongs to another account
        "409":
          description: Draft identifier changed or an unfinished guest draft conflicts with a different active account draft
        "404":
          description: Visitor record was not found
        "503":
          description: Firebase verification is unavailable
  /filmmakers/projects/start:
    post:
      operationId: startFilmmakerProject
      tags: [filmmakers]
      summary: Create or resume the account's single active filmmaker draft
      description: Preserves earlier projects, copies the account's stable price-test group, and rotates the httpOnly visitor cookie to the account draft. An unclaimed completed legacy result must be claimed before starting. A non-empty guest draft is left untouched and returns 409 when the account already has another active draft.
      security:
        - firebaseBearer: []
      responses:
        "200":
          description: Account draft created or resumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilmmakerDraftState"
        "401":
          description: Verified sign-in required
        "403":
          description: Current visitor is linked to another account
        "409":
          description: Claim the current completed submission or resolve the conflicting guest draft before starting another project
        "404":
          description: Current visitor record was not found
        "503":
          description: Firebase verification is unavailable
  /filmmakers/projects/resume:
    post:
      operationId: resumeFilmmakerProject
      tags: [filmmakers]
      summary: Restore the signed-in filmmaker's active draft visitor cookie
      security:
        - firebaseBearer: []
      responses:
        "200":
          description: Active draft cookie restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilmmakerDraftState"
        "401":
          description: Verified sign-in required
        "404":
          description: No resumable draft exists
        "503":
          description: Firebase verification is unavailable
  /filmmakers/projects/leave:
    post:
      operationId: leaveFilmmakerAccount
      tags: [filmmakers]
      summary: Rotate the current project visitor cookie before account sign-out
      description: Requires a verified Firebase account. Rotates the cookie only when its visitor is linked to this Firebase UID. Preserves unclaimed guest or another account's visitor cookie without deleting or modifying any project or draft.
      security:
        - firebaseBearer: []
      responses:
        "200":
          description: Whether the visitor cookie was rotated to a fresh guest visitor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilmmakerAccountLeave"
        "401":
          description: Verified sign-in required
        "403":
          description: Firebase email must be verified
        "503":
          description: Firebase verification is unavailable
  /filmmakers/projects/{project_id}/backers:
    get:
      operationId: getFilmmakerProjectBackers
      tags: [filmmakers]
      summary: Confirmed backers of an account-owned project (name, email and amount), private to the filmmaker
      security:
        - firebaseBearer: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Confirmed backers, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilmmakerProjectBackers"
        "400":
          description: Invalid project ID
        "401":
          description: Verified sign-in required
        "404":
          description: Project is not available to this account
        "503":
          description: Firebase verification is unavailable
  /filmmakers/projects/{project_id}/updates:
    get:
      operationId: getFilmmakerProjectUpdates
      tags: [filmmakers]
      summary: The filmmaker's own project updates (any status), milestone options and the number of backers who would be emailed
      security:
        - firebaseBearer: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Updates newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilmmakerProjectUpdates"
        "400":
          description: Invalid project ID
        "401":
          description: Verified sign-in required
        "503":
          description: Firebase verification is unavailable
        "404":
          description: Project is not available to this account
    post:
      operationId: createFilmmakerProjectUpdate
      tags: [filmmakers]
      summary: Post a milestone update; it waits for owner review before appearing publicly or being emailed
      security:
        - firebaseBearer: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FilmmakerProjectUpdateInput"
      responses:
        "201":
          description: Update created, waiting for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilmmakerProjectUpdate"
        "400":
          description: Invalid update
        "401":
          description: Verified sign-in required
        "503":
          description: Firebase verification is unavailable
        "404":
