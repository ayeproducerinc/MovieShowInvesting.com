      additionalProperties: false
      required: [visitor_cookie_rotated]
      properties:
        visitor_cookie_rotated: { type: boolean }
    FilmmakerShowcaseUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
