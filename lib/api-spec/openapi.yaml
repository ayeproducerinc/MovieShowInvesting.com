        filming_start_skipped: { type: boolean, description: "Skip for now; recorded separately from a blank" }
        money_needed_by_month: { type: ["string", "null"], pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$", description: "YYYY-MM; private to the filmmaker and admin" }
        money_needed_by_skipped: { type: boolean, description: "Skip for now; recorded separately from a blank" }
        deal_answer: { type: string, enum: [yes, maybe, no] }
        offer_per100: { type: integer, minimum: 125 }
        offer_other_text: { type: string }
        wants_lower: { type: boolean }
        payback_terms: { type: string, enum: [works, need_some, other] }
        payback_terms_other: { type: string }
        funding_sources:
