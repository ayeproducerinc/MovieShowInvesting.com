openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: site
    description: Public site setup and visitor tracking
  - name: progress
    description: Saved flow progress and visitor assignment
  - name: filmmakers
    description: Filmmaker submissions
  - name: projects
    description: Unlisted project pages and showcase requests
  - name: questions
    description: Private filmmaker question relay
  - name: explore
    description: Project discovery and investor matching
  - name: investor
    description: Investor preferences and intent
  - name: messaging
    description: Private investor and filmmaker conversations
  - name: locations
    description: International city and region suggestions
  - name: admin
    description: Firebase-protected administration
  - name: auth
    description: Browser sign-in and session status
paths:
  /auth/user:
    get:
      operationId: getCurrentAuthUser
      tags: [auth]
      summary: Get the current browser session user
      responses:
        "200":
          description: Current session user, or null when signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
  /login:
    get:
      operationId: beginBrowserLogin
      tags: [auth]
      summary: Redirect legacy login links to the Google sign-in screen
      parameters:
        - name: returnTo
          in: query
          required: false
          schema: { type: string }
      responses:
        "302": { description: Redirect to the filmmaker Google sign-in screen }
  /callback:
    get:
      operationId: handleBrowserLoginCallback
      tags: [auth]
      summary: Reject deprecated browser OIDC callbacks
      responses:
        "410": { description: Replit OIDC callbacks are no longer accepted }
  /logout:
    post:
      operationId: logoutBrowserSession
      tags: [auth]
      summary: End the browser session using a same-origin request
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Optional local path returned for post-logout navigation.
          schema: { type: string, maxLength: 2048 }
      responses:
        "200":
          description: Local session destroyed; returnTo is a validated same-origin path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutSessionEnvelope"
        "403": { description: Same-origin Origin header required for cookie-authenticated logout }
  /question-config:
    get:
      operationId: getQuestionConfig
      tags: [questions]
      summary: Public question form availability and Turnstile site key
      responses:
        "200":
          description: Current question form configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionConfig"
  /projects/{slug}/questions:
    post:
      operationId: askFilmmaker
      tags: [questions]
      summary: Send a private question to a project's filmmaker
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionInput"
      responses:
        "201":
          description: Question delivered privately
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionSubmission"
        "400": { description: Invalid question }
        "403": { description: Anti-bot challenge failed }
        "404": { description: Project unavailable }
        "429": { description: Question rate limit reached }
        "503": { description: Question delivery unavailable }
  /filmmakers/projects/{projectId}/questions:
    get:
      operationId: getFilmmakerQuestions
      tags: [questions]
      summary: List account-owned project questions, unanswered first
      security:
        - firebaseBearer: []
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Private questions without asker email addresses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilmmakerQuestions"
        "401": { description: Sign-in required }
        "403": { description: Verified email required }
        "404": { description: Project is not owned by this account }
  /filmmakers/projects/{projectId}/questions/{messageId}/answer:
    post:
      operationId: answerFilmmakerQuestion
      tags: [questions]
      summary: Email a private answer from the signed-in filmmaker
      security:
        - firebaseBearer: []
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: integer, minimum: 1 }
        - in: path
          name: messageId
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionAnswerInput"
      responses:
        "200":
          description: Answer delivered privately
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionAnswerResult"
        "401": { description: Sign-in required }
        "404": { description: Unanswered account-owned question not found }
        "503": { description: Delivery unavailable; question remains unanswered }
  /questions/answer-token:
    post:
      operationId: answerQuestionByToken
      tags: [questions]
      summary: Answer a question using a single-use emailed link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionTokenAnswerInput"
      responses:
        "200":
          description: Answer delivered privately
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionAnswerResult"
        "404": { description: "Link is invalid, expired, or used" }
        "503": { description: Delivery unavailable; question remains unanswered }
  /questions/report-token:
    post:
      operationId: reportQuestionByToken
      tags: [questions]
      summary: Report a private question using a single-use emailed link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionReportInput"
      responses:
        "200":
          description: Question reported to moderation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionReportResult"
        "404": { description: "Link is invalid, expired, or used" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /stats:
    get:
      operationId: getSiteStats
      tags: [site]
      summary: Database-backed home page count
      responses:
        "200":
          description: Current filmmaker total
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteStats"
  /config:
    get:
      operationId: getFirebaseConfig
      tags: [site]
      summary: Public Firebase web configuration
      responses:
        "200":
          description: Configuration available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirebaseConfig"
        "503":
          description: Firebase has not been configured yet
  /locations:
    get:
      operationId: searchLocations
      tags: [locations]
      summary: Search city and region suggestions
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 80
      responses:
        "200":
          description: Matching city and region suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationSearchPayload"
        "400":
          description: Invalid location search query
        "502":
          description: Location provider returned an invalid response
        "503":
          description: Location provider is temporarily unavailable
  /visit:
    post:
      operationId: recordVisit
      tags: [site]
      summary: Persist a visitor and their first campaign attribution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisitInput"
      responses:
        "200":
          description: Existing or new visitor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Visit"
  /price-group:
    get:
      operationId: getPriceGroup
      tags: [progress]
      summary: Assign a visitor once to price-test group A or B
      responses:
        "200":
          description: Persisted assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceGroup"
  /progress/{flow}:
    get:
      operationId: getFlowProgress
      tags: [progress]
      summary: Read the current visitor's saved flow progress
      description: Unlinked visitor progress remains cookie-accessible. A filmmaker visitor linked to Firebase UID requires a verified Bearer token matching that UID.
      security:
        - firebaseBearer: []
        - {}
      parameters:
        - in: path
          name: flow
          required: true
          schema:
            $ref: "#/components/schemas/Flow"
      responses:
        "200":
          description: Saved progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowProgress"
        "404":
          description: No progress saved
        "401":
          description: Verified sign-in required for an account-linked filmmaker visitor
        "403":
          description: Firebase UID does not own this visitor
        "503":
          description: Firebase verification is unavailable
  /progress:
    post:
      operationId: saveFlowProgress
      tags: [progress]
      summary: Save visitor or account-scoped in-progress answers
      description: Unlinked visitor progress remains cookie-accessible. Investor progress under a verified account is stored separately from guest progress. A filmmaker visitor linked to Firebase UID requires a matching verified Bearer token.
      security:
        - firebaseBearer: []
        - {}
      parameters:
        - name: X-MSI-Draft-Id
          in: header
          required: false
          description: Required for account-linked filmmaker visitors; must match the current filmmaker flow_progress.id.
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveProgressInput"
      responses:
        "200":
          description: Saved progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowProgress"
        "400":
          description: Invalid input or missing visitor
        "401":
          description: Verified sign-in required for an account-linked filmmaker visitor
        "403":
          description: Firebase UID does not own this visitor
        "503":
          description: Firebase verification is unavailable
        "409":
          description: Draft context header is missing or does not match the current draft
  /filmmakers:
    post:
      operationId: submitFilmmaker
      tags: [filmmakers]
      summary: Submit the filmmaker flow after Cloudflare Turnstile verification
      description: Unlinked guest submissions remain cookie-accessible. A visitor linked to Firebase UID requires a verified Bearer token matching that UID. The single-use Turnstile response is verified server-side before creating a submission.
      security:
        - firebaseBearer: []
        - {}
      parameters:
        - name: X-MSI-Draft-Id
          in: header
          required: false
          description: Required for account-linked visitors; must match the current filmmaker flow_progress.id.
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FilmmakerSubmissionInput"
      responses:
        "201":
          description: Filmmaker submission created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilmmakerSubmission"
        "400":
          description: Invalid submission, missing visitor, or linked visitor contact email does not match its verified account email
        "401":
          description: Verified sign-in required for an account-linked visitor
        "403":
          description: Firebase UID does not own this visitor, or Turnstile verification failed, expired, or was already used
        "503":
          description: Firebase verification or required anti-bot protection is unavailable
        "409":
          description: Draft context header is missing or does not match the current draft
        "429":
          description: Too many submissions from this visitor or network in the past hour
  /filmmaker-submission-config:
    get:
      operationId: getFilmmakerSubmissionConfig
      tags: [filmmakers]
      summary: Read filmmaker final-submission availability and public Turnstile site key
      responses:
        "200":
          description: Final submission protection configuration; unavailable until both Turnstile keys are configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilmmakerSubmissionConfig"
  /filmmakers/result:
    get:
      operationId: getFilmmakerResult
      tags: [filmmakers]
      summary: Read the current visitor's completed filmmaker result
      description: Unlinked guest results remain cookie-accessible. An account-linked visitor requires a verified Bearer token matching its Firebase UID.
      security:
        - firebaseBearer: []
        - {}
      responses:
        "200":
          description: Completed submission result, including a no-project result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilmmakerResult"
        "404":
          description: No completed filmmaker submission for this visitor
        "401":
          description: Verified sign-in required for an account-linked visitor
        "403":
          description: Firebase UID does not own this visitor
        "503":
          description: Firebase verification is unavailable
  /filmmakers/projects:
    get:
      operationId: getFilmmakerProjects
      tags: [filmmakers]
      summary: List projects and draft state for the signed-in filmmaker
      description: Requires a verified Firebase account token. Project ownership is based on linked Firebase UID, never the submitted email alone.
      security:
        - firebaseBearer: []
      responses:
        "200":
          description: Account-owned projects and whether an active draft can be resumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilmmakerProjects"
        "401":
          description: Verified sign-in required
        "403":
          description: Firebase email must be verified
        "503":
          description: Firebase verification is unavailable
  /filmmakers/interest-alerts:
    get:
      operationId: getFilmmakerInterestAlerts
      tags: [filmmakers]
      summary: List private confirmed non-binding interest alerts for account-owned projects
      security:
        - firebaseBearer: []
      responses:
        "200":
          description: Owner-scoped alerts, without investor details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilmmakerInterestAlerts"
        "401": { description: Verified sign-in required }
  /filmmakers/interest-alerts/{alertId}/read:
    post:
      operationId: readFilmmakerInterestAlert
      tags: [filmmakers]
      summary: Mark an account-owned interest alert as read
      security:
        - firebaseBearer: []
      parameters:
        - in: path
          name: alertId
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Alert marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilmmakerInterestAlert"
        "401": { description: Verified sign-in required }
        "404": { description: Alert not owned by this account }
  /filmmakers/phone-verification:
    post:
      operationId: verifyFilmmakerPhone
      tags: [filmmakers]
      summary: Synchronize or revoke the signed-in filmmaker's Firebase phone verification
      description: Requires a verified Firebase email. Saves the phone_number claim decoded from the refreshed Firebase ID token across every filmmaker record attached to this UID, or clears phoneVerified for every record when the current token has no phone_number claim.
      security:
        - firebaseBearer: []
      responses:
        "200":
          description: Current Firebase phone verification synchronized or revoked for the filmmaker account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilmmakerPhoneVerification"
        "401":
          description: Verified sign-in required
        "503":
          description: Firebase verification is unavailable
  /filmmakers/projects/claim:
    post:
      operationId: claimFilmmakerProject
      tags: [filmmakers]
      summary: Link the current visitor draft or legacy submission to a verified account
      description: Requires the current visitor cookie. A completed legacy submission can only be claimed if its stored email matches the verified account email and it is not linked to another UID. A non-empty unlinked guest draft cannot be claimed while a different active draft exists for the account; the guest cookie and answers are preserved on conflict.
      security:
        - firebaseBearer: []
      responses:
        "200":
          description: Current draft or submission is linked to this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilmmakerProjectClaim"
        "400":
          description: A recorded visitor cookie is required
        "401":
          description: Verified sign-in required
        "403":
          description: Verified email does not match the submission or visitor belongs to another account
        "409":
          description: An unfinished guest draft conflicts with a different active account draft
        "404":
          description: Visitor record was not found
        "503":
          description: Firebase verification is unavailable
  /filmmakers/projects/start:
    post:
      operationId: startFilmmakerProject
      tags: [filmmakers]
      summary: Create or resume the account's single active filmmaker draft
      description: Preserves earlier projects, copies the account's stable price-test group, and rotates the httpOnly visitor cookie to the account draft. An unclaimed completed legacy result must be claimed before starting. A non-empty guest draft is left untouched and returns 409 when the account already has another active draft.
      security:
        - firebaseBearer: []
      responses:
        "200":
          description: Account draft created or resumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilmmakerDraftState"
        "401":
          description: Verified sign-in required
        "403":
          description: Current visitor is linked to another account
        "409":
          description: Claim the current completed submission or resolve the conflicting guest draft before starting another project
        "404":
          description: Current visitor record was not found
        "503":
          description: Firebase verification is unavailable
  /filmmakers/projects/resume:
    post:
      operationId: resumeFilmmakerProject
      tags: [filmmakers]
      summary: Restore the signed-in filmmaker's active draft visitor cookie
      security:
        - firebaseBearer: []
      responses:
        "200":
          description: Active draft cookie restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilmmakerDraftState"
        "401":
          description: Verified sign-in required
        "404":
          description: No resumable draft exists
        "503":
          description: Firebase verification is unavailable
  /filmmakers/projects/leave:
    post:
      operationId: leaveFilmmakerAccount
      tags: [filmmakers]
      summary: Rotate the current project visitor cookie before account sign-out
      description: Requires a verified Firebase account. Rotates the cookie only when its visitor is linked to this Firebase UID. Preserves unclaimed guest or another account's visitor cookie without deleting or modifying any project or draft.
      security:
        - firebaseBearer: []
      responses:
        "200":
          description: Whether the visitor cookie was rotated to a fresh guest visitor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilmmakerAccountLeave"
        "401":
          description: Verified sign-in required
        "403":
          description: Firebase email must be verified
        "503":
          description: Firebase verification is unavailable
  /filmmakers/projects/{project_id}/select:
    post:
      operationId: selectFilmmakerProject
      tags: [filmmakers]
      summary: Select an account-owned project for the existing visitor-scoped editing routes
      security:
        - firebaseBearer: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Project visitor cookie selected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilmmakerProjectSelection"
        "400":
          description: Invalid project ID
        "401":
          description: Verified sign-in required
        "404":
          description: Project is not available to this account
        "503":
          description: Firebase verification is unavailable
  /filmmakers/showcase:
    patch:
      operationId: updateFilmmakerShowcase
      tags: [filmmakers]
      summary: Request showcase and update the current visitor's project showcase details
      description: Unlinked guest visits remain cookie-accessible. An account-linked visitor requires a verified Bearer token matching its Firebase UID.
      security:
        - firebaseBearer: []
        - {}
      parameters:
        - name: X-MSI-Project-Id
          in: header
          required: false
          description: Required for account-linked visitors; must match the completed project resolved from the current visitor cookie.
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FilmmakerShowcaseUpdate"
      responses:
        "200":
          description: Updated showcase request and content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilmmakerShowcase"
        "400":
          description: Invalid showcase details or missing visitor
        "404":
          description: No completed project submission for this visitor
        "401":
          description: Verified sign-in required for an account-linked visitor
        "403":
          description: Firebase UID does not own this visitor
        "503":
          description: Firebase verification is unavailable
        "409":
          description: Project context header is missing or does not match the current project
  /filmmakers/review-checkout:
    post:
      operationId: startPitchReviewCheckout
      tags: [filmmakers]
      summary: Start a sandbox checkout for the current completed pitch
      security:
        - firebaseBearer: []
        - {}
      parameters:
        - name: X-MSI-Project-Id
          in: header
          required: false
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Sandbox checkout URL, or already-submitted status
          content:
            application/json:
              schema:
                type: object
                required: [url, already_submitted]
                properties:
                  url: { type: ["string", "null"] }
                  already_submitted: { type: boolean }
        "400": { description: Visitor or completed pitch required }
        "401": { description: Sign-in required for an account-linked pitch }
        "409": { description: Project context changed or pitch ineligible }
        "503": { description: Sandbox checkout is unavailable }
  /filmmakers/review-checkout/status:
    get:
      operationId: getPitchReviewCheckoutStatus
      tags: [filmmakers]
      summary: Reconcile sandbox payment for the current pitch and read review status
      security:
        - firebaseBearer: []
        - {}
      parameters:
        - name: X-MSI-Project-Id
          in: header
          required: false
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Review payment and moderation status
          content:
            application/json:
              schema:
                type: object
                required: [paid, pending, approved, declined]
                properties:
                  paid: { type: boolean }
                  pending: { type: boolean }
                  approved: { type: boolean }
                  declined: { type: boolean }
        "404": { description: No completed pitch found }
  /filmmakers/media/config:
    get:
      operationId: getFilmmakerMediaConfig
      tags: [filmmakers]
      summary: Read non-secret filmmaker media upload availability and limits
      responses:
        "200":
          description: Provider availability and upload constraints
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilmmakerMediaConfig"
  /filmmakers/media/trailer:
    post:
      operationId: uploadFilmmakerTrailer
      tags: [filmmakers]
      summary: Bounded streaming upload of a trailer to Bunny Stream for the visitor-owned project
      description: Unlinked guest uploads remain cookie-accessible. An account-linked visitor requires a verified Bearer token matching its Firebase UID.
      security:
        - firebaseBearer: []
        - {}
      parameters:
        - name: X-MSI-Project-Id
          in: header
          required: false
          description: Required for account-linked visitors; must match the completed project resolved from the current visitor cookie.
          schema: { type: integer, minimum: 1 }
        - name: Content-Length
          in: header
          required: true
          schema: { type: integer, minimum: 1, maximum: 524288000 }
      requestBody:
        required: true
        content:
          video/mp4:
            schema:
              $ref: "#/components/schemas/FilmmakerTrailerBinary"
          video/webm:
            schema:
              $ref: "#/components/schemas/FilmmakerTrailerBinary"
          video/quicktime:
            schema:
              $ref: "#/components/schemas/FilmmakerTrailerBinary"
      responses:
        "201":
          description: Uploaded, verified, and finalized trailer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilmmakerTrailerUpload"
        "400":
          description: Invalid or incomplete upload or missing visitor cookie
        "411":
          description: Content-Length is required
        "413":
          description: Trailer exceeds the 500 MB limit
        "404":
          description: No completed owned project
        "429":
          description: Trailer upload concurrency limit reached
        "502":
          description: Bunny Stream upload or verification failed
        "401":
          description: Verified sign-in required for an account-linked visitor
        "403":
          description: Firebase UID does not own this visitor
        "503":
          description: Bunny Stream or Firebase verification is unavailable
        "409":
          description: Project context header is missing or does not match the current project
  /filmmakers/media/image:
    post:
      operationId: uploadFilmmakerImage
      tags: [filmmakers]
      summary: Upload an owned poster or share image to Bunny Storage
      description: Unlinked guest uploads remain cookie-accessible. An account-linked visitor requires a verified Bearer token matching its Firebase UID.
      security:
        - firebaseBearer: []
        - {}
      parameters:
        - name: X-MSI-Project-Id
          in: header
          required: false
          description: Required for account-linked visitors; must match the completed project resolved from the current visitor cookie.
          schema: { type: integer, minimum: 1 }
        - name: kind
          in: query
          required: true
          schema:
            type: string
            enum: [poster, share]
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
          image/webp:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Saved image CDN URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilmmakerImageUpload"
        "400":
          description: Invalid image, kind, or missing visitor cookie
        "404":
          description: No completed owned project
        "502":
          description: Bunny Storage upload failed
        "401":
          description: Verified sign-in required for an account-linked visitor
        "403":
          description: Firebase UID does not own this visitor
        "503":
          description: Bunny Storage or Firebase verification is unavailable
        "409":
          description: Project context header is missing or does not match the current project
    delete:
      operationId: deleteFilmmakerImage
      tags: [filmmakers]
      summary: Remove the selected owned poster or share image
      description: Unlinked guests are authorized by their visitor cookie. An account-linked visitor requires a verified Bearer token matching its Firebase UID. Only the selected image pointer is removed, and the stored file is deleted only when its URL matches this project's owned Bunny Storage path.
      security:
        - firebaseBearer: []
        - {}
      parameters:
        - name: X-MSI-Project-Id
          in: header
          required: false
          description: Required for account-linked visitors; must match the completed project resolved from the current visitor cookie.
          schema: { type: integer, minimum: 1 }
        - name: kind
          in: query
          required: true
          schema:
            type: string
            enum: [poster, share]
        - name: X-MSI-Expected-Image-Url
          in: header
          required: true
          description: Exact image URL shown in the client when removal was requested. Prevents a stale tab from removing a newly uploaded replacement.
          schema: { type: string, minLength: 1, maxLength: 2048 }
      responses:
        "204":
          description: Selected image removed (or already absent)
        "400":
          description: Invalid image kind or missing visitor cookie
        "404":
          description: No completed owned project
        "401":
          description: Verified sign-in required for an account-linked visitor
        "403":
          description: Firebase UID does not own this visitor
        "409":
          description: Project context is stale or the selected image changed during removal
        "502":
          description: Bunny Storage could not remove the selected image
        "503":
          description: Bunny Storage or Firebase verification is unavailable
  /projects/{slug}:
    get:
      operationId: getPublicProject
      tags: [projects]
      summary: Read safe public details for a project accessible by unlisted link
      description: is_owner is true only for the provider-qualified verified account or the original browser visitor cookie associated with the project.
      security:
        - firebaseBearer: []
        - {}
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string, minLength: 1, maxLength: 120, pattern: "^[a-z0-9-]+$" }
      responses:
        "200":
          description: Safe public project details and confirmed pledge total
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProject"
        "404":
          description: Project not found or hidden
  /projects/{slug}/share:
    get:
      operationId: getProjectShareMetadata
      tags: [projects]
      summary: Serve crawler-readable social metadata and a browser project link
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string, minLength: 1, maxLength: 120, pattern: "^[a-z0-9-]+$" }
      responses:
        "200":
          description: Social metadata HTML with a link to the project page
          content:
            text/html:
              schema: { type: string }
        "404":
          description: Project not found or hidden
  /explore:
    get:
      operationId: getExplore
      tags: [explore]
      summary: Browse approved projects for investors
      description: is_owner is true only for the provider-qualified verified account or the original browser visitor cookie associated with the project.
      security:
        - firebaseBearer: []
        - {}
      parameters:
        - name: stage
          in: query
          required: false
          schema: { type: string, enum: [distribution, production, idea] }
        - name: genre
          in: query
          required: false
          schema: { type: string }
        - name: sort
          in: query
          required: false
          schema: { type: string }
        - name: search
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Matching discoverable projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExploreProjects"
  /investor/matches:
    post:
      operationId: matchInvestor
      tags: [investor]
      summary: Match projects against investor preferences
      description: Matching projects include is_owner, based only on a provider-qualified verified account or the original browser visitor cookie.
      security:
        - firebaseBearer: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvestorMatchInput"
      responses:
        "200":
          description: Matching projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvestorMatches"
  /investor/intents:
    post:
      operationId: saveInvestorIntent
      tags: [investor]
      summary: Save visitor-scoped intent or verified account intent and preferences
      description: Rejects allocations to projects owned by the provider-qualified verified account or associated with the original visitor cookie. Ownership is never inferred from email alone.
      security:
        - firebaseBearer: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvestorIntentInput"
      responses:
        "201":
          description: Investor intent saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvestorIntentResult"
        "400":
          description: Invalid intent amounts, allocations, or project selections
        "401": { description: Supplied bearer token is invalid }
        "409":
          description: Existing interest belongs to another identity or an unclaimed guest visit
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [error]
                properties:
                  error: { type: string }
                  code: { type: string, enum: [guest_interest_conflict] }
  /investor/intents/current:
    get:
      operationId: getCurrentInvestorIntent
      tags: [investor]
      summary: Read visitor-scoped intent or verified account intent
      security:
        - firebaseBearer: []
        - {}
      responses:
        "200":
          description: Current investor intent, if one has been saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvestorIntentCurrent"
        "401": { description: Supplied bearer token is invalid }
  /investor/intents/claim:
    post:
      operationId: claimInvestorIntent
      tags: [investor]
      summary: Link an unclaimed guest intent from this browser to the verified account
      description: Requires the original visitor cookie and a verified account whose email matches the saved guest intent. Does not alter the amount or allocations.
      security:
        - firebaseBearer: []
      responses:
        "200":
          description: Guest intent is linked to the account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvestorIntentClaimResult"
        "401": { description: Verified sign-in required }
        "403": { description: Account email does not match or visitor belongs to another account }
        "404": { description: No guest intent on this browser }
        "409": { description: Account already has a different investor intent }
  /investor/intents/confirm:
    post:
      operationId: confirmInvestorIntent
      tags: [investor]
      summary: Sign and confirm the account's saved non-binding interest
      description: Confirmation is idempotent for the same saved interest. No money is collected. Project allocations become public-count eligible only on successful confirmation. Pending interest cannot be confirmed for a project owned by the provider-qualified verified account or associated with the original visitor cookie; email alone does not establish ownership.
      security:
        - firebaseBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvestorIntentConfirmationInput"
      responses:
        "200":
          description: Interest confirmed, or identical confirmation already recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvestorIntentConfirmationResult"
        "400": { description: Signature or acknowledgment is invalid }
        "401": { description: Verified sign-in required }
        "403": { description: Account email does not match the saved interest }
        "404": { description: No saved intent for this account }
        "409": { description: "Saved amount or project choices changed, or a selected project is no longer available" }
  /messaging/config:
    get:
      operationId: getMessagingConfig
      tags: [messaging]
      summary: Read messaging availability and disclosure
      responses:
        "200":
          description: Messaging configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagingConfig"
  /projects/{slug}/conversations:
    post:
      operationId: createConversation
      tags: [messaging]
      summary: Start a private conversation about a project
      security:
        - firebaseBearer: []
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "201":
          description: Conversation created or resumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "401": { description: Sign-in required }
        "404": { description: Project unavailable }
  /me/conversations:
    get:
      operationId: getMyConversations
      tags: [messaging]
      summary: List conversations for the signed-in participant
      security:
        - firebaseBearer: []
      responses:
        "200":
          description: Participant conversations without email addresses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversations"
        "401": { description: Sign-in required }
        "503": { description: Messaging has not been approved for use }
  /conversations/{id}:
    get:
      operationId: getConversation
      tags: [messaging]
      summary: Read a participant conversation and its messages
      security:
        - firebaseBearer: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Conversation and messages without participant email addresses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationView"
        "401": { description: Sign-in required }
        "404": { description: Conversation not found for this participant }
        "503": { description: Messaging has not been approved for use }
  /conversations/{id}/messages:
    post:
      operationId: sendConversationMessage
      tags: [messaging]
      summary: Send a message in a participant conversation
      security:
        - firebaseBearer: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationMessageInput"
      responses:
        "201":
          description: Message sent without exposing participant email addresses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationMessage"
        "401": { description: Sign-in required }
        "404": { description: Conversation not found for this participant }
        "409": { description: Conversation is locked }
  /conversations/{id}/report:
    post:
      operationId: reportConversation
      tags: [messaging]
      summary: Report a participant conversation
      security:
        - firebaseBearer: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationReportInput"
      responses:
        "200":
          description: Conversation reported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationReportResult"
        "401": { description: Sign-in required }
        "404": { description: Conversation not found for this participant }
  /admin/conversations:
    get:
      operationId: getAdminConversations
      tags: [admin]
      summary: List conversations for administrator moderation
      description: Requires a Firebase Bearer token with administrator access.
      security:
        - firebaseBearer: []
      responses:
        "200":
          description: Conversations without participant email addresses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversations"
        "401": { description: Sign-in required }
        "403": { description: Not an admin }
  /admin/conversations/{id}:
    get:
      operationId: getAdminConversation
      tags: [admin]
      summary: Read a conversation and its moderation audit
      description: Requires a Firebase Bearer token with administrator access.
      security:
        - firebaseBearer: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Conversation detail without participant email addresses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationDetail"
        "401": { description: Sign-in required }
        "403": { description: Not an admin }
        "404": { description: Conversation not found }
  /admin/conversations/{id}/moderation:
    post:
      operationId: moderateAdminConversation
      tags: [admin]
      summary: Moderate, review, or explicitly resolve a conversation report
      description: Requires a Firebase Bearer token with administrator access. Every action is audited. Only resolve clears a report; it requires a non-empty moderator note, preserves the separate lock state, and retains report details. Review and unlock never resolve a report.
      security:
        - firebaseBearer: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationModerationInput"
      responses:
        "200":
          description: Moderation action applied; resolve clears only reported and returns the unchanged lock state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationModerationResult"
        "401": { description: Sign-in required }
        "403": { description: Not an admin }
        "404": { description: Conversation not found }
        "400": { description: Invalid action or missing moderator note for report resolution }
        "409": { description: The conversation does not have an active report to resolve }
  /admin/me:
    get:
      operationId: getAdminMe
      tags: [admin]
      summary: Check verified Firebase admin access
      security:
        - firebaseBearer: []
      responses:
        "200":
          description: Administrator identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminIdentity"
        "401":
          description: Sign-in required
        "403":
          description: Not an admin
        "503":
          description: Admin account not provisioned
  /admin/tables/{section}:
    get:
      operationId: getAdminTable
      tags: [admin]
      summary: Read one real-data admin table for display and CSV export
      security:
        - firebaseBearer: []
      parameters:
        - in: path
          name: section
          required: true
          schema:
            $ref: "#/components/schemas/AdminSection"
      responses:
        "200":
          description: Table data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTable"
        "401":
          description: Sign-in required
        "403":
          description: Not an admin
  /admin/projects/{projectId}:
    patch:
      operationId: reviewAdminProject
      tags: [admin]
      summary: Approve or hide a project
      security:
        - firebaseBearer: []
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminProjectReviewInput"
      responses:
        "200":
          description: Updated project moderation state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProjectReview"
        "401":
          description: Sign-in required
        "403":
          description: Not an admin
        "404":
          description: Project not found
  /admin/messages/{messageId}:
    patch:
      operationId: reviewAdminMessage
      tags: [admin]
      summary: Hide or unhide a question
      security:
        - firebaseBearer: []
      parameters:
        - in: path
          name: messageId
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminMessageReviewInput"
      responses:
        "200":
          description: Updated message moderation state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMessageReview"
        "401":
          description: Sign-in required
        "403":
          description: Not an admin
        "404":
          description: Message not found
components:
  securitySchemes:
    firebaseBearer:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token
  schemas:
    AuthUser:
      type: object
      additionalProperties: false
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        firstName: { type: ["string", "null"] }
        lastName: { type: ["string", "null"] }
        profileImageUrl: { type: ["string", "null"], format: uri }
    AuthUserEnvelope:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
    LogoutSessionEnvelope:
      type: object
      additionalProperties: false
      required: [success, returnTo]
      properties:
        success: { type: boolean, const: true }
        returnTo: { type: string, minLength: 1, maxLength: 2048 }
    QuestionConfig:
      type: object
      additionalProperties: false
      required: [available, turnstile_site_key]
      properties:
        available: { type: boolean }
        turnstile_site_key: { type: ["string", "null"] }
    QuestionInput:
      type: object
      additionalProperties: false
      required: [first_name, email, question, turnstile_token]
      properties:
        website: { type: string, maxLength: 256, description: "Leave blank. Bot-detection field; never saved." }
        first_name: { type: string, minLength: 1, maxLength: 80 }
        email: { type: string, format: email, maxLength: 254 }
        question: { type: string, minLength: 5, maxLength: 3000 }
        turnstile_token: { type: string, minLength: 1 }
    QuestionSubmission:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, const: submitted }
    FilmmakerQuestion:
      type: object
      additionalProperties: false
      required: [id, first_name, question, answer, asked_at, answered_at, reported, delivery_pending]
      properties:
        id: { type: integer }
        first_name: { type: ["string", "null"] }
        question: { type: ["string", "null"] }
        answer: { type: ["string", "null"] }
        asked_at: { type: string, format: date-time }
        answered_at: { type: ["string", "null"], format: date-time }
        reported: { type: boolean }
        delivery_pending: { type: boolean }
    FilmmakerQuestions:
      type: object
      additionalProperties: false
      required: [questions]
      properties:
        questions:
          type: array
          items:
            $ref: "#/components/schemas/FilmmakerQuestion"
    QuestionAnswerInput:
      type: object
      additionalProperties: false
      required: [answer]
      properties:
        answer: { type: string, minLength: 1, maxLength: 5000 }
    QuestionTokenAnswerInput:
      type: object
      additionalProperties: false
      required: [token, answer]
      properties:
        token: { type: string, pattern: "^[a-fA-F0-9]{64}$" }
        answer: { type: string, minLength: 1, maxLength: 5000 }
    QuestionAnswerResult:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, const: answered }
    QuestionReportInput:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, pattern: "^[a-fA-F0-9]{64}$" }
    QuestionReportResult:
      type: object
      additionalProperties: false
      required: [reported]
      properties:
        reported: { type: boolean, const: true }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SiteStats:
      type: object
      required: [filmmakers]
      properties:
        filmmakers:
          type: integer
          minimum: 0
    FirebaseConfig:
      type: object
      required: [apiKey, authDomain, projectId, appId]
      properties:
        apiKey: { type: string }
        authDomain: { type: string }
        projectId: { type: string }
        appId: { type: string }
    VisitInput:
      type: object
      properties:
        utm_source: { type: string, maxLength: 200 }
        utm_medium: { type: string, maxLength: 200 }
        utm_campaign: { type: string, maxLength: 200 }
        ref: { type: string, maxLength: 200 }
    Visit:
      type: object
      required: [visitor_id]
      properties:
        visitor_id: { type: string }
    PriceGroup:
      type: object
      required: [group]
      properties:
        group: { type: string, enum: [A, B] }
    Flow:
      type: string
      enum: [filmmaker, investor]
    SaveProgressInput:
      type: object
      required: [flow, last_screen, answers]
      properties:
        flow:
          $ref: "#/components/schemas/Flow"
        last_screen: { type: integer, minimum: 1, maximum: 6 }
        answers:
          type: object
          additionalProperties: true
        completed: { type: boolean }
        expected_investor_owner: { type: string, description: Investor worksheet identity captured on opening; the API rejects a save if the signed-in account changed }
    FilmmakerSubmissionInput:
      type: object
      additionalProperties: false
      required: [no_project_yet, name, email, city, favorite_genres, chat_opt_in, turnstile_token]
      properties:
        website: { type: string, description: "Leave blank. Bot-detection field; never stored with the submission." }
        turnstile_token: { type: string, minLength: 1, maxLength: 2048, description: "Single-use Cloudflare Turnstile response, verified server-side and never stored." }
        no_project_yet: { type: boolean }
        stage: { type: string, enum: [distribution, production, idea] }
        title: { type: string }
        format: { type: string, enum: [movie, show] }
        genre: { type: string, enum: [Horror, Drama, Comedy, Thriller, Documentary, Sci-Fi, Other] }
        genre_other: { type: string }
        logline: { type: string }
        trailer_url: { type: string }
        pilot_url: { type: string }
        budget: { type: integer, minimum: 1 }
        budget_from_example: { type: boolean }
        deal_answer: { type: string, enum: [yes, maybe, no] }
        offer_per100: { type: integer, minimum: 125 }
        offer_other_text: { type: string }
        wants_lower: { type: boolean }
        payback_terms: { type: string, enum: [works, need_some, other] }
        payback_terms_other: { type: string }
        funding_sources:
          type: array
          items: { type: string }
        funding_other: { type: string }
        reached_goal: { type: boolean }
        funding_experience: { type: string }
        name: { type: string, minLength: 1 }
        email: { type: string, format: email }
        city: { type: string, minLength: 1 }
        state: { type: string, minLength: 1 }
        country:
          type: string
          pattern: "^[A-Z]{2}$"
        favorite_genres:
          type: array
          items: { type: string }
        chat_opt_in: { type: boolean }
        phone: { type: string }
    FilmmakerSubmissionConfig:
      type: object
      required: [available, turnstile_site_key]
      properties:
        available: { type: boolean }
        turnstile_site_key: { type: ["string", "null"], minLength: 1 }
    LocationSearchPayload:
      type: object
      required: [locations]
      properties:
        locations:
          type: array
          items:
            $ref: "#/components/schemas/LocationSuggestion"
    LocationSuggestion:
      type: object
      required: [city, region, country, country_code]
      properties:
        city: { type: string, minLength: 1 }
        region: { type: string }
        country: { type: string, minLength: 1 }
        country_code: { type: string, pattern: "^[A-Z]{2}$" }
    FilmmakerSubmission:
      type: object
      required: [filmmaker_id, project_id]
      properties:
        filmmaker_id: { type: integer, minimum: 1 }
        project_id: { type: ["integer", "null"], minimum: 1 }
    FilmmakerResult:
      type: object
      additionalProperties: false
      required: [completed, no_project_yet, project_id, project_slug, stage, stage_other, title, format, genre, genre_other, logline, offer_per100, offer_other_text, wants_lower, budget, budget_from_example, price_group, deal_answer, payback_terms, payback_terms_other, showcase_requested, approved, hidden, synopsis, team_links, money_use, distribution_plan, trailer_url, poster_url, share_image_url]
      properties:
        completed: { type: boolean, enum: [true] }
        no_project_yet: { type: boolean }
        project_id: { type: ["integer", "null"], minimum: 1 }
        project_slug: { type: ["string", "null"] }
        stage: { type: ["string", "null"], enum: [distribution, production, idea, other, null] }
        stage_other: { type: ["string", "null"] }
        title: { type: ["string", "null"] }
        format: { type: ["string", "null"] }
        genre: { type: ["string", "null"] }
        genre_other: { type: ["string", "null"] }
        logline: { type: ["string", "null"] }
        offer_per100: { type: ["integer", "null"] }
        offer_other_text: { type: ["string", "null"] }
