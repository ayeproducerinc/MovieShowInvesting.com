      properties:
        city: { type: string, minLength: 1 }
        region: { type: string }
        country: { type: string, minLength: 1 }
        country_code: { type: string, pattern: "^[A-Z]{2}$" }
    FilmmakerSubmission:
      type: object
      required: [filmmaker_id, project_id, checkout_proof]
      properties:
        filmmaker_id: { type: integer, minimum: 1 }
        project_id: { type: ["integer", "null"], minimum: 1 }
        checkout_proof: { type: ["string", "null"] }
    FilmmakerResult:
      type: object
      additionalProperties: false
      required: [completed, no_project_yet, project_id, project_slug, checkout_proof, stage, stage_other, title, format, genre, genre_other, logline, offer_per100, offer_other_text, wants_lower, budget, budget_from_example, price_group, deal_answer, payback_terms, payback_terms_other, showcase_requested, approved, hidden, synopsis, team_links, money_use, distribution_plan, trailer_url, poster_url, share_image_url]
      properties:
        public_filmmaker_name: { type: ["string", "null"], description: Optional filmmaker credit explicitly chosen for the public project page }
        team_info: { type: ["string", "null"] }
        crowdfunding_ran: { type: ["boolean", "null"] }
        crowdfunding_campaign: { type: ["string", "null"] }
        crowdfunding_same_project: { type: ["boolean", "null"] }
        crowdfunding_goal: { type: ["number", "null"] }
        crowdfunding_raised: { type: ["number", "null"] }
        crowdfunding_obligations: { type: ["string", "null"] }
        proposal:
          anyOf:
            - $ref: "#/components/schemas/FilmmakerProposal"
            - type: "null"
        completed: { type: boolean, enum: [true] }
        no_project_yet: { type: boolean }
        project_id: { type: ["integer", "null"], minimum: 1 }
        project_slug: { type: ["string", "null"] }
        checkout_proof: { type: ["string", "null"] }
        stage: { type: ["string", "null"], enum: [distribution, production, idea, other, null] }
        stage_other: { type: ["string", "null"] }
        title: { type: ["string", "null"] }
        format: { type: ["string", "null"] }
        genre: { type: ["string", "null"] }
        genre_other: { type: ["string", "null"] }
        logline: { type: ["string", "null"] }
        offer_per100: { type: ["integer", "null"] }
        offer_other_text: { type: ["string", "null"] }
        wants_lower: { type: ["boolean", "null"] }
