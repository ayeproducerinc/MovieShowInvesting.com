          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationModerationInput"
      responses:
        "200":
          description: Moderation action applied; resolve clears only reported and returns the unchanged lock state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationModerationResult"
        "401": { description: Sign-in required }
        "403": { description: Not an admin }
        "404": { description: Conversation not found }
        "400": { description: Invalid action or missing moderator note for report resolution }
        "409": { description: The conversation does not have an active report to resolve }
  /admin/me:
    get:
      operationId: getAdminMe
      tags: [admin]
      summary: Check verified Firebase admin access
      security:
        - firebaseBearer: []
      responses:
        "200":
          description: Administrator identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminIdentity"
        "401":
          description: Sign-in required
        "403":
          description: Not an admin
        "503":
          description: Admin account not provisioned
  /admin/tables/{section}:
    get:
      operationId: getAdminTable
      tags: [admin]
      summary: Read one real-data admin table for display and CSV export
      security:
        - firebaseBearer: []
      parameters:
        - in: path
          name: section
          required: true
          schema:
            $ref: "#/components/schemas/AdminSection"
      responses:
        "200":
          description: Table data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTable"
        "401":
          description: Sign-in required
        "403":
          description: Not an admin
  /admin/confirmed-test-project-cleanup:
    post:
      operationId: cleanupAdminTestProjects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminTestProjectCleanupInput"
      responses:
        "200":
          description: Owner-confirmed test project cleanup result; private history retained
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTestProjectCleanupResult"
        "401":
          description: Sign-in required
        "403":
          description: Administrator required
        "409":
          description: Confirmed inventory changed; nothing deleted
  /admin/projects/{projectId}:
    patch:
      operationId: reviewAdminProject
      tags: [admin]
      summary: Approve or hide a project
      security:
        - firebaseBearer: []
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminProjectReviewInput"
      responses:
        "200":
          description: Updated project moderation state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProjectReview"
        "401":
          description: Sign-in required
        "403":
          description: Not an admin
        "404":
          description: Project not found
  /admin/projects/{projectId}/review:
    get:
      operationId: getAdminProjectReview
      tags: [admin]
      summary: Read the selected complete submitted pitch and all current attachments for admin review
      description: Existing admin table rows and selection IDs remain unchanged; this endpoint is loaded by the selected project's Details action.
      security:
        - firebaseBearer: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Full pitch answers and attachment state for this project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProjectReviewDetail"
        "401":
          description: Verified administrator sign-in required
        "403":
          description: Account is not an administrator
        "404":
          description: Project not found
  /admin/messages/{messageId}:
    patch:
      operationId: reviewAdminMessage
      tags: [admin]
      summary: Hide or unhide a question
      security:
        - firebaseBearer: []
      parameters:
        - in: path
          name: messageId
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminMessageReviewInput"
      responses:
        "200":
          description: Updated message moderation state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMessageReview"
        "401":
          description: Sign-in required
        "403":
          description: Not an admin
        "404":
          description: Message not found
  /admin/investors:
    get:
      operationId: getAdminInvestors
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 200 } }
        - { name: status, in: query, schema: { type: string, enum: [signup, draft, saved, confirmed] } }
        - { name: project_id, in: query, schema: { type: integer, minimum: 1 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 250, default: 50 } }
      responses:
        "200":
          description: Protected investor intake and confirmed waitlist records
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminInvestorList" }
  /admin/investors/export:
    get:
      operationId: exportAdminInvestors
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 200 } }
        - { name: status, in: query, schema: { type: string, enum: [signup, draft, saved, confirmed] } }
        - { name: project_id, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Consent-aware confirmed waitlist CSV for manual outreach
          content:
            text/csv:
              schema: { type: string }
  /admin/investors/{recordId}:
    get:
      operationId: getAdminInvestor
      parameters:
        - { name: recordId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Private complete investor review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminInvestorDetail" }
  /admin/projects/{projectId}/review-notes:
    put:
      operationId: saveAdminReviewNotes
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminReviewNotesInput" }
      responses:
        "200":
          description: Saved manual review notes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminReviewNotesInput" }
  /investor/notification-permission:
    get:
      operationId: getInvestorNotificationPermission
      responses:
        "200":
          description: Current verified-account offering notification choice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvestorNotificationPermission" }
    put:
      operationId: setInvestorNotificationPermission
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvestorNotificationInput" }
      responses:
        "200":
          description: Dated permission or withdrawal saved without changing signed interest
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvestorNotificationPermission" }
components:
  securitySchemes:
    firebaseBearer:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token
  schemas:
    DraftResetSelection:
      type: object
      required: [key, version, label]
      properties:
        key: { type: string, pattern: "^[a-f0-9]{64}$" }
        version: { type: string, pattern: "^[a-f0-9]{64}$" }
        label: { type: string, maxLength: 100 }
    DraftResetPreview:
      type: object
      required: [context, drafts]
      properties:
        context: { type: string, pattern: "^[a-f0-9]{64}$" }
        drafts:
          type: array
          maxItems: 10000
          items: { $ref: "#/components/schemas/DraftResetSelection" }
    DraftResetInput:
      allOf:
        - { $ref: "#/components/schemas/DraftResetPreview" }
        - type: object
          required: [confirm]
          properties:
            confirm: { type: boolean, enum: [true] }
    DraftCleanupInput:
      type: object
      required: [environment, dry_run]
      properties:
        environment: { type: string, enum: [preview, published] }
        dry_run: { type: boolean }
        confirmation: { type: string, enum: ["CLEAR ALL UNFINISHED FILMMAKER DRAFTS"] }
        drafts:
          type: array
          maxItems: 10000
          items: { $ref: "#/components/schemas/DraftResetSelection" }
    ReferralCaptureInput:
      type: object
      required: [code]
      properties:
        code: { type: string, minLength: 6, maxLength: 32 }
        manual: { type: boolean, default: false }
    ReferralCaptureResult:
      type: object
      required: [saved, expires_at]
      properties:
        saved: { type: boolean }
        expires_at: { type: string }
    ReferralMember:
      type: object
      required: [code, referred_by, signup_count, pending_count, eligible_cents, paid_cents, rewards]
      properties:
        code: { type: string }
        referred_by: { type: boolean }
        signup_count: { type: integer }
        pending_count: { type: integer }
        eligible_cents: { type: integer }
        paid_cents: { type: integer }
        rewards:
          type: array
          items: { $ref: "#/components/schemas/ReferralReward" }
    ReferralReward:
      type: object
      required: [id, amount_cents, status, project_title, payment_checked_at, paid_at, payout_reference, review_flag]
      properties:
        id: { type: integer }
        amount_cents: { type: integer }
        status: { type: string, enum: [pending, eligible, paid, cancelled, review_required] }
        project_title: { type: ["string", "null"] }
        payment_checked_at: { type: ["string", "null"] }
        paid_at: { type: ["string", "null"] }
        payout_reference: { type: ["string", "null"] }
        review_flag: { type: boolean }
    ReferralLedgerRow:
      type: object
      required: [referral_id, referrer_email, referred_email, signed_up_at, project_id, milestone, reward]
      properties:
        referral_id: { type: string }
        referrer_email: { type: string }
        referred_email: { type: string }
        signed_up_at: { type: string }
        project_id: { type: ["integer", "null"] }
        milestone: { type: string, enum: [signed_up, paid_pending_review, declined, not_public, listed] }
        reward:
          oneOf:
            - $ref: "#/components/schemas/ReferralReward"
            - { type: "null" }
    ReferralLedger:
      type: object
      required: [rows, page, total, page_size]
      properties:
        page: { type: integer }
        total: { type: integer }
        page_size: { type: integer }
        rows:
          type: array
          items: { $ref: "#/components/schemas/ReferralLedgerRow" }
    ReferralPayoutInput:
      type: object
      required: [reference, paid_on, confirmed_sent]
      properties:
        reference: { type: string, minLength: 3, maxLength: 120 }
        paid_on: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        confirmed_sent: { type: boolean }
    InvestorNotificationInput:
      type: object
      additionalProperties: false
      required: [allowed, expected_owner]
      properties:
        allowed: { type: boolean }
        expected_owner: { type: string }
    InvestorNotificationPermission:
      type: object
      required: [allowed, recorded_at, version]
      properties:
        allowed: { type: ["boolean", "null"] }
        recorded_at: { type: ["string", "null"] }
        version: { type: string }
    AdminInvestorSummary:
      type: object
      required: [id, name, email, status, first_seen_at, last_activity_at, confirmed_amount, notification_allowed, project_ids]
      properties:
        id: { type: string }
        name: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        status: { type: string, enum: [signup, draft, saved, confirmed] }
        first_seen_at: { type: ["string", "null"] }
        last_activity_at: { type: ["string", "null"] }
        confirmed_amount: { type: integer }
        notification_allowed: { type: ["boolean", "null"] }
        project_ids: { type: array, items: { type: integer } }
    AdminWaitlistProject:
      type: object
      required: [id, title, eligible]
      properties:
        id: { type: integer }
        title: { type: ["string", "null"] }
        eligible: { type: boolean }
    AdminInvestorList:
      type: object
      required: [items, total, projects]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminInvestorSummary" }
        total: { type: integer }
        projects:
          type: array
          items: { $ref: "#/components/schemas/AdminWaitlistProject" }
    AdminInvestorDetail:
      type: object
      required: [id, profile, draft, entries, verification, age_confirmation, notification_history]
      properties:
        id: { type: string }
        profile: { type: object, additionalProperties: true }
        draft: { type: ["object", "null"], additionalProperties: true }
        entries:
          type: array
          items: { type: object, additionalProperties: true }
        verification: { type: object, additionalProperties: true }
        age_confirmation: { type: ["object", "null"], additionalProperties: true }
        notification_history:
          type: array
          items: { type: object, additionalProperties: true }
    AdminReviewNotesInput:
      type: object
      additionalProperties: false
      required: [notes, obligations_checked, authority_checked, questions_resolved]
      properties:
        notes: { type: string, maxLength: 8000 }
        obligations_checked: { type: boolean }
        authority_checked: { type: boolean }
        questions_resolved: { type: boolean }
        updated_at: { type: ["string", "null"] }
    FilmmakerTrailerUploadStart:
      type: object
      additionalProperties: false
      required: [size, type, filename]
      properties:
        size: { type: integer, minimum: 1, maximum: 524288000 }
        type: { type: string, enum: [video/mp4, video/webm, video/quicktime] }
        filename: { type: string, minLength: 1, maxLength: 200 }
    FilmmakerTrailerUploadSession:
      type: object
      additionalProperties: false
      required: [token, chunk_bytes]
      properties:
        token: { type: string }
        chunk_bytes: { type: integer, minimum: 1 }
    FilmmakerTrailerUploadProgress:
      type: object
      additionalProperties: false
      required: [offset]
      properties:
        offset: { type: integer, minimum: 0 }
        error: { type: string }
    FilmmakerTrailerUploadCancel:
      type: object
      additionalProperties: false
      required: [cancelled]
      properties:
        cancelled: { type: boolean }
    QuestionConfig:
      type: object
      additionalProperties: false
      required: [available]
      properties:
        available: { type: boolean }
    QuestionInput:
      type: object
      additionalProperties: false
      required: [first_name, email, question]
      properties:
        website: { type: string, maxLength: 256, description: "Leave blank. Bot-detection field; never saved." }
        first_name: { type: string, minLength: 1, maxLength: 80 }
        email: { type: string, format: email, maxLength: 254 }
        question: { type: string, minLength: 5, maxLength: 3000 }
    QuestionSubmission:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, const: submitted }
    FilmmakerQuestion:
      type: object
      additionalProperties: false
      required: [id, first_name, question, answer, asked_at, answered_at, reported, delivery_pending]
      properties:
        id: { type: integer }
        first_name: { type: ["string", "null"] }
        question: { type: ["string", "null"] }
        answer: { type: ["string", "null"] }
        asked_at: { type: string, format: date-time }
        answered_at: { type: ["string", "null"], format: date-time }
        reported: { type: boolean }
        delivery_pending: { type: boolean }
    FilmmakerQuestions:
      type: object
      additionalProperties: false
      required: [questions]
      properties:
        questions:
          type: array
          items:
            $ref: "#/components/schemas/FilmmakerQuestion"
    QuestionAnswerInput:
      type: object
      additionalProperties: false
      required: [answer]
      properties:
        answer: { type: string, minLength: 1, maxLength: 5000 }
    QuestionTokenAnswerInput:
      type: object
      additionalProperties: false
      required: [token, answer]
      properties:
        token: { type: string, pattern: "^[a-fA-F0-9]{64}$" }
        answer: { type: string, minLength: 1, maxLength: 5000 }
    QuestionAnswerResult:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, const: answered }
    QuestionReportInput:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, pattern: "^[a-fA-F0-9]{64}$" }
    QuestionReportResult:
      type: object
      additionalProperties: false
      required: [reported]
      properties:
        reported: { type: boolean, const: true }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    FilmmakerCommunityInput:
