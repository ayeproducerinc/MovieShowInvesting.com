  /filmmakers/media/trailer:
    post:
      operationId: uploadFilmmakerTrailer
      tags: [filmmakers]
      summary: Bounded streaming upload of a trailer to Bunny Stream for the visitor-owned project
      description: Unlinked guest uploads remain cookie-accessible. An account-linked visitor requires a verified Bearer token matching its Firebase UID.
      security:
        - firebaseBearer: []
        - {}
      parameters:
        - name: X-MSI-Project-Id
          in: header
          required: false
          description: Required for account-linked visitors; must match the completed project resolved from the current visitor cookie.
          schema: { type: integer, minimum: 1 }
        - name: Content-Length
          in: header
          required: true
          schema: { type: integer, minimum: 1, maximum: 524288000 }
      requestBody:
        required: true
        content:
          video/mp4:
            schema:
              $ref: "#/components/schemas/FilmmakerTrailerBinary"
          video/webm:
            schema:
              $ref: "#/components/schemas/FilmmakerTrailerBinary"
          video/quicktime:
            schema:
              $ref: "#/components/schemas/FilmmakerTrailerBinary"
      responses:
        "201":
          description: Uploaded, verified, and finalized trailer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilmmakerTrailerUpload"
        "400":
          description: Invalid or incomplete upload or missing visitor cookie
        "411":
          description: Content-Length is required
        "413":
          description: Trailer exceeds the 500 MB limit
        "404":
          description: No completed owned project
        "429":
          description: Trailer upload concurrency limit reached
        "502":
          description: Bunny Stream upload or verification failed
        "401":
          description: Verified sign-in required for an account-linked visitor
        "403":
          description: Firebase UID does not own this visitor
        "503":
          description: Bunny Stream or Firebase verification is unavailable
        "409":
          description: Project context header is missing or does not match the current project
  /filmmakers/media/image:
    post:
      operationId: uploadFilmmakerImage
      tags: [filmmakers]
      summary: Upload an owned poster or share image to Bunny Storage
      description: Unlinked guest uploads remain cookie-accessible. An account-linked visitor requires a verified Bearer token matching its Firebase UID.
      security:
        - firebaseBearer: []
        - {}
      parameters:
        - name: X-MSI-Project-Id
          in: header
          required: false
          description: Required for account-linked visitors; must match the completed project resolved from the current visitor cookie.
          schema: { type: integer, minimum: 1 }
        - name: kind
          in: query
          required: true
          schema:
            type: string
            enum: [poster, share]
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
          image/webp:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Saved image CDN URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilmmakerImageUpload"
        "400":
          description: Invalid image, kind, or missing visitor cookie
        "404":
          description: No completed owned project
        "502":
          description: Bunny Storage upload failed
        "401":
          description: Verified sign-in required for an account-linked visitor
        "403":
          description: Firebase UID does not own this visitor
        "503":
          description: Bunny Storage or Firebase verification is unavailable
        "409":
          description: Project context header is missing or does not match the current project
    delete:
      operationId: deleteFilmmakerImage
      tags: [filmmakers]
      summary: Remove the selected owned poster or share image
      description: Unlinked guests are authorized by their visitor cookie. An account-linked visitor requires a verified Bearer token matching its Firebase UID. Only the selected image pointer is removed, and the stored file is deleted only when its URL matches this project's owned Bunny Storage path.
      security:
        - firebaseBearer: []
        - {}
      parameters:
        - name: X-MSI-Project-Id
          in: header
          required: false
          description: Required for account-linked visitors; must match the completed project resolved from the current visitor cookie.
          schema: { type: integer, minimum: 1 }
        - name: kind
          in: query
          required: true
          schema:
            type: string
            enum: [poster, share]
        - name: X-MSI-Expected-Image-Url
          in: header
          required: true
          description: Exact image URL shown in the client when removal was requested. Prevents a stale tab from removing a newly uploaded replacement.
          schema: { type: string, minLength: 1, maxLength: 2048 }
      responses:
        "204":
          description: Selected image removed (or already absent)
        "400":
          description: Invalid image kind or missing visitor cookie
        "404":
          description: No completed owned project
        "401":
          description: Verified sign-in required for an account-linked visitor
        "403":
          description: Firebase UID does not own this visitor
        "409":
          description: Project context is stale or the selected image changed during removal
        "502":
          description: Bunny Storage could not remove the selected image
        "503":
          description: Bunny Storage or Firebase verification is unavailable
