openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: site
    description: Public site setup and visitor tracking
  - name: progress
    description: Saved flow progress and visitor assignment
  - name: filmmakers
    description: Filmmaker submissions
  - name: projects
    description: Unlisted project pages and showcase requests
  - name: locations
    description: International city and region suggestions
  - name: admin
    description: Firebase-protected administration
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /stats:
    get:
      operationId: getSiteStats
      tags: [site]
      summary: Database-backed home page count
      responses:
        "200":
          description: Current filmmaker total
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteStats"
  /config:
    get:
      operationId: getFirebaseConfig
      tags: [site]
      summary: Public Firebase web configuration
      responses:
        "200":
          description: Configuration available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirebaseConfig"
        "503":
          description: Firebase has not been configured yet
  /locations:
    get:
      operationId: searchLocations
      tags: [locations]
      summary: Search city and region suggestions
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 80
      responses:
        "200":
          description: Matching city and region suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationSearchPayload"
        "400":
          description: Invalid location search query
        "502":
          description: Location provider returned an invalid response
        "503":
          description: Location provider is temporarily unavailable
  /visit:
    post:
      operationId: recordVisit
      tags: [site]
      summary: Persist a visitor and their first campaign attribution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisitInput"
      responses:
        "200":
          description: Existing or new visitor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Visit"
  /price-group:
    get:
      operationId: getPriceGroup
      tags: [progress]
      summary: Assign a visitor once to price-test group A or B
      responses:
        "200":
          description: Persisted assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceGroup"
  /progress/{flow}:
    get:
      operationId: getFlowProgress
      tags: [progress]
      summary: Read the current visitor's saved flow progress
      parameters:
        - in: path
          name: flow
          required: true
          schema:
            $ref: "#/components/schemas/Flow"
      responses:
        "200":
          description: Saved progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowProgress"
        "404":
          description: No progress saved
  /progress:
    post:
      operationId: saveFlowProgress
      tags: [progress]
      summary: Save the current visitor's in-progress answers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveProgressInput"
      responses:
        "200":
          description: Saved progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowProgress"
        "400":
          description: Invalid input or missing visitor
  /filmmakers:
    post:
      operationId: submitFilmmaker
      tags: [filmmakers]
      summary: Submit the filmmaker flow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FilmmakerSubmissionInput"
      responses:
        "201":
          description: Filmmaker submission created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilmmakerSubmission"
        "400":
          description: Invalid submission or missing visitor
  /filmmakers/result:
    get:
      operationId: getFilmmakerResult
      tags: [filmmakers]
      summary: Read the current visitor's completed filmmaker result
      responses:
        "200":
          description: Completed submission result, including a no-project result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilmmakerResult"
        "404":
          description: No completed filmmaker submission for this visitor
  /filmmakers/showcase:
    patch:
      operationId: updateFilmmakerShowcase
      tags: [filmmakers]
      summary: Request showcase and update the current visitor's project showcase details
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FilmmakerShowcaseUpdate"
      responses:
        "200":
          description: Updated showcase request and content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilmmakerShowcase"
        "400":
          description: Invalid showcase details or missing visitor
        "404":
          description: No completed project submission for this visitor
  /filmmakers/media/config:
    get:
      operationId: getFilmmakerMediaConfig
      tags: [filmmakers]
      summary: Read non-secret filmmaker media upload availability and limits
      responses:
        "200":
          description: Provider availability and upload constraints
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilmmakerMediaConfig"
  /filmmakers/media/trailer:
    post:
      operationId: uploadFilmmakerTrailer
      tags: [filmmakers]
      summary: Bounded streaming upload of a trailer to Bunny Stream for the visitor-owned project
      parameters:
        - name: Content-Length
          in: header
          required: true
          schema: { type: integer, minimum: 1, maximum: 524288000 }
      requestBody:
        required: true
        content:
          video/mp4:
            schema:
              $ref: "#/components/schemas/FilmmakerTrailerBinary"
          video/webm:
            schema:
              $ref: "#/components/schemas/FilmmakerTrailerBinary"
          video/quicktime:
            schema:
              $ref: "#/components/schemas/FilmmakerTrailerBinary"
      responses:
        "201":
          description: Uploaded, verified, and finalized trailer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilmmakerTrailerUpload"
        "400":
          description: Invalid or incomplete upload or missing visitor cookie
        "411":
          description: Content-Length is required
        "413":
          description: Trailer exceeds the 500 MB limit
        "404":
          description: No completed owned project
        "429":
          description: Trailer upload concurrency limit reached
        "502":
          description: Bunny Stream upload or verification failed
        "503":
          description: Bunny Stream is not configured
  /filmmakers/media/trailer/thumbnail:
    get:
      operationId: getFilmmakerTrailerThumbnail
      tags: [filmmakers]
      summary: Fetch the current visitor-owned Bunny trailer thumbnail without exposing provider credentials
      responses:
        "200":
          description: Generated trailer thumbnail
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "202":
          description: Bunny is still processing the thumbnail
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: processing }
        "404":
          description: No current uploaded Bunny trailer belongs to this visitor
        "502":
          description: Bunny thumbnail could not be retrieved
        "503":
          description: Bunny thumbnail access is not configured
  /filmmakers/media/image:
    post:
      operationId: uploadFilmmakerImage
      tags: [filmmakers]
      summary: Upload an owned poster or share image to Bunny Storage
      parameters:
        - name: kind
          in: query
          required: true
          schema:
            type: string
            enum: [poster, share]
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
          image/webp:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Saved image CDN URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilmmakerImageUpload"
        "400":
          description: Invalid image, kind, or missing visitor cookie
        "404":
          description: No completed owned project
        "502":
          description: Bunny Storage upload failed
        "503":
          description: Bunny Storage is not configured
  /projects/{slug}:
    get:
      operationId: getPublicProject
      tags: [projects]
      summary: Read safe public details for a project accessible by unlisted link
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string, minLength: 1, maxLength: 120, pattern: "^[a-z0-9-]+$" }
      responses:
        "200":
          description: Safe public project details and confirmed pledge total
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProject"
        "404":
          description: Project not found or hidden
  /projects/{slug}/share:
    get:
      operationId: getProjectShareMetadata
      tags: [projects]
      summary: Serve crawler-readable social metadata and a browser project link
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string, minLength: 1, maxLength: 120, pattern: "^[a-z0-9-]+$" }
      responses:
        "200":
          description: Social metadata HTML with a link to the project page
          content:
            text/html:
              schema: { type: string }
        "404":
          description: Project not found or hidden
  /admin/me:
    get:
      operationId: getAdminMe
      tags: [admin]
      summary: Check verified Firebase admin access
      security:
        - firebaseBearer: []
      responses:
        "200":
          description: Administrator identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminIdentity"
        "401":
          description: Sign-in required
        "403":
          description: Not an admin
        "503":
          description: Admin account not provisioned
  /admin/tables/{section}:
    get:
      operationId: getAdminTable
      tags: [admin]
      summary: Read one real-data admin table for display and CSV export
      security:
        - firebaseBearer: []
      parameters:
        - in: path
          name: section
          required: true
          schema:
            $ref: "#/components/schemas/AdminSection"
      responses:
        "200":
          description: Table data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTable"
        "401":
          description: Sign-in required
        "403":
          description: Not an admin
  /admin/projects/{projectId}:
    patch:
      operationId: reviewAdminProject
      tags: [admin]
      summary: Approve or hide a project
      security:
        - firebaseBearer: []
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminProjectReviewInput"
      responses:
        "200":
          description: Updated project moderation state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProjectReview"
        "401":
          description: Sign-in required
        "403":
          description: Not an admin
        "404":
          description: Project not found
  /admin/messages/{messageId}:
    patch:
      operationId: reviewAdminMessage
      tags: [admin]
      summary: Hide or unhide a question
      security:
        - firebaseBearer: []
      parameters:
        - in: path
          name: messageId
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminMessageReviewInput"
      responses:
        "200":
          description: Updated message moderation state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMessageReview"
        "401":
          description: Sign-in required
        "403":
          description: Not an admin
        "404":
          description: Message not found
components:
  securitySchemes:
    firebaseBearer:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SiteStats:
      type: object
      required: [filmmakers]
      properties:
        filmmakers:
          type: integer
          minimum: 0
    FirebaseConfig:
      type: object
      required: [apiKey, authDomain, projectId, appId]
      properties:
        apiKey: { type: string }
        authDomain: { type: string }
        projectId: { type: string }
        appId: { type: string }
    VisitInput:
      type: object
      properties:
        utm_source: { type: string, maxLength: 200 }
        utm_medium: { type: string, maxLength: 200 }
        utm_campaign: { type: string, maxLength: 200 }
        ref: { type: string, maxLength: 200 }
    Visit:
      type: object
      required: [visitor_id]
      properties:
        visitor_id: { type: string }
    PriceGroup:
      type: object
      required: [group]
      properties:
        group: { type: string, enum: [A, B] }
    Flow:
      type: string
      enum: [filmmaker, investor]
    SaveProgressInput:
      type: object
      required: [flow, last_screen, answers]
      properties:
        flow:
          $ref: "#/components/schemas/Flow"
        last_screen: { type: integer, minimum: 1, maximum: 6 }
        answers:
          type: object
          additionalProperties: true
        completed: { type: boolean }
    FilmmakerSubmissionInput:
      type: object
      additionalProperties: false
      required: [no_project_yet, name, email, city, favorite_genres, chat_opt_in]
      properties:
        no_project_yet: { type: boolean }
        stage: { type: string, enum: [distribution, production, idea, other] }
        stage_other: { type: string }
        title: { type: string }
        format: { type: string, enum: [movie, show] }
        genre: { type: string, enum: [Horror, Drama, Comedy, Thriller, Documentary, Sci-Fi, Other] }
        genre_other: { type: string }
        logline: { type: string }
        trailer_url: { type: string }
        pilot_url: { type: string }
        budget: { type: integer, minimum: 1 }
        budget_from_example: { type: boolean }
        deal_answer: { type: string, enum: [yes, maybe, no] }
        offer_per100: { type: integer, minimum: 125 }
        offer_other_text: { type: string }
        wants_lower: { type: boolean }
        payback_terms: { type: string, enum: [works, need_some, other] }
        payback_terms_other: { type: string }
        funding_sources:
          type: array
          items: { type: string }
        funding_other: { type: string }
        reached_goal: { type: boolean }
        funding_experience: { type: string }
        name: { type: string, minLength: 1 }
        email: { type: string, format: email }
        city: { type: string, minLength: 1 }
        state: { type: string, minLength: 1 }
        country:
          type: string
          pattern: "^[A-Z]{2}$"
        favorite_genres:
          type: array
          items: { type: string }
        chat_opt_in: { type: boolean }
        phone: { type: string }
    LocationSearchPayload:
      type: object
      required: [locations]
      properties:
        locations:
          type: array
          items:
            $ref: "#/components/schemas/LocationSuggestion"
    LocationSuggestion:
      type: object
      required: [city, region, country, country_code]
      properties:
        city: { type: string, minLength: 1 }
        region: { type: string }
        country: { type: string, minLength: 1 }
        country_code: { type: string, pattern: "^[A-Z]{2}$" }
    FilmmakerSubmission:
      type: object
      required: [filmmaker_id, project_id]
      properties:
        filmmaker_id: { type: integer, minimum: 1 }
        project_id: { type: ["integer", "null"], minimum: 1 }
    FilmmakerResult:
      type: object
      additionalProperties: false
      required: [completed, no_project_yet, project_slug, stage, stage_other, title, format, genre, genre_other, logline, offer_per100, offer_other_text, wants_lower, budget, budget_from_example, price_group, deal_answer, payback_terms, payback_terms_other, showcase_requested, approved, hidden, synopsis, team_links, money_use, distribution_plan, trailer_url, poster_url, share_image_url]
      properties:
        completed: { type: boolean, enum: [true] }
        no_project_yet: { type: boolean }
        project_slug: { type: ["string", "null"] }
        stage: { type: ["string", "null"] }
        stage_other: { type: ["string", "null"] }
        title: { type: ["string", "null"] }
        format: { type: ["string", "null"] }
        genre: { type: ["string", "null"] }
        genre_other: { type: ["string", "null"] }
        logline: { type: ["string", "null"] }
        offer_per100: { type: ["integer", "null"] }
        offer_other_text: { type: ["string", "null"] }
        wants_lower: { type: ["boolean", "null"] }
        budget: { type: ["integer", "null"] }
        budget_from_example: { type: ["boolean", "null"] }
        price_group: { type: ["string", "null"], enum: [A, B, null] }
        deal_answer: { type: ["string", "null"] }
        payback_terms: { type: ["string", "null"] }
        payback_terms_other: { type: ["string", "null"] }
        showcase_requested: { type: ["boolean", "null"] }
        approved: { type: ["boolean", "null"] }
        hidden: { type: ["boolean", "null"] }
        synopsis: { type: ["string", "null"] }
        team_links:
          type: array
          items: { type: string }
        money_use: { type: ["string", "null"] }
        distribution_plan: { type: ["string", "null"] }
        trailer_url: { type: ["string", "null"], format: uri }
        poster_url: { type: ["string", "null"], format: uri }
        share_image_url: { type: ["string", "null"], format: uri }
    FilmmakerShowcaseUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        showcase_requested: { type: boolean }
        synopsis: { type: ["string", "null"], maxLength: 5000 }
        team_links:
          type: ["array", "null"]
          maxItems: 8
          items:
            type: string
            maxLength: 500
            pattern: "^https?://"
        money_use: { type: ["string", "null"], maxLength: 3000 }
        distribution_plan: { type: ["string", "null"], maxLength: 3000 }
        trailer_url:
          type: ["string", "null"]
          maxLength: 2048
          pattern: "^https?://"
    FilmmakerShowcase:
      type: object
      additionalProperties: false
      required: [project_slug, showcase_requested, approved, hidden, synopsis, team_links, money_use, distribution_plan, trailer_url]
      properties:
        project_slug: { type: string }
        showcase_requested: { type: boolean }
        approved: { type: boolean }
        hidden: { type: boolean }
        synopsis: { type: ["string", "null"] }
        team_links:
          type: array
          items: { type: string }
        money_use: { type: ["string", "null"] }
        distribution_plan: { type: ["string", "null"] }
        trailer_url: { type: ["string", "null"] }
    FilmmakerMediaConfig:
      type: object
      additionalProperties: false
      required: [stream_available, storage_available, trailer_max_bytes, trailer_types, image_max_bytes, image_types]
      properties:
        stream_available: { type: boolean }
        storage_available: { type: boolean }
        trailer_max_bytes: { type: integer, const: 524288000 }
        trailer_types:
          type: array
          items: { type: string, enum: [video/mp4, video/webm, video/quicktime] }
        image_max_bytes: { type: integer, const: 10485760 }
        image_types:
          type: array
          items: { type: string, enum: [image/jpeg, image/png, image/webp] }
    FilmmakerTrailerBinary:
      type: string
      format: binary
    FilmmakerTrailerUpload:
      type: object
      additionalProperties: false
      required: [video_id, trailer_url, embed_url, thumbnail_url]
      properties:
        video_id: { type: string, format: uuid }
        trailer_url: { type: string, format: uri }
        embed_url: { type: string, format: uri }
        thumbnail_url: { type: ["string", "null"], format: uri }
    FilmmakerImageUpload:
      type: object
      additionalProperties: false
      required: [kind, image_url]
      properties:
        kind: { type: string, enum: [poster, share] }
        image_url: { type: string, format: uri }
    PublicProject:
      type: object
      additionalProperties: false
      required: [slug, title, format, genre, stage, logline, synopsis, team_links, money_use, distribution_plan, trailer_url, trailer_thumbnail_url, poster_url, confirmed_pledge_total, approved, showcase_requested]
      properties:
        slug: { type: string }
        title: { type: string }
        format: { type: ["string", "null"] }
        genre: { type: ["string", "null"] }
        stage: { type: ["string", "null"] }
        logline: { type: ["string", "null"] }
        synopsis: { type: ["string", "null"] }
        team_links:
          type: array
          items: { type: string }
        money_use: { type: ["string", "null"] }
        distribution_plan: { type: ["string", "null"] }
        trailer_url: { type: ["string", "null"], format: uri }
        trailer_thumbnail_url: { type: ["string", "null"], format: uri }
        poster_url: { type: ["string", "null"], format: uri }
        confirmed_pledge_total: { type: number, minimum: 0 }
        approved: { type: boolean }
        showcase_requested: { type: boolean }
    FlowProgress:
      type: object
      required: [flow, last_screen, answers, completed, updated_at]
      properties:
        flow:
          $ref: "#/components/schemas/Flow"
        last_screen: { type: integer }
        answers:
          type: object
          additionalProperties: true
        completed: { type: boolean }
        updated_at: { type: string, format: date-time }
    AdminIdentity:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role: { type: string, enum: [admin] }
    AdminSection:
      type: string
      enum: [summary, pledges, location, funnels, market, price-test, queues, messages, channels, email-log]
    AdminTable:
      type: object
      required: [section, title, columns, rows, total]
      properties:
        section:
          $ref: "#/components/schemas/AdminSection"
        title: { type: string }
        columns:
          type: array
          items: { type: string }
        rows:
          type: array
          items:
            type: array
            items: { type: string }
        total: { type: integer, minimum: 0 }
    AdminProjectReviewInput:
      type: object
      properties:
        approved: { type: boolean }
        hidden: { type: boolean }
    AdminProjectReview:
      type: object
      required: [id, approved, hidden]
      properties:
        id: { type: integer }
        approved: { type: boolean }
        hidden: { type: boolean }
    AdminMessageReviewInput:
      type: object
      required: [hidden]
      properties:
        hidden: { type: boolean }
    AdminMessageReview:
      type: object
      required: [id, hidden]
      properties:
        id: { type: integer }
        hidden: { type: boolean }

