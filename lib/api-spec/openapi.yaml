      format: binary
    FilmmakerTrailerUpload:
      type: object
      additionalProperties: false
      required: [video_id, trailer_url, embed_url, thumbnail_url]
      properties:
        video_id: { type: string, format: uuid }
        trailer_url: { type: string, format: uri }
        embed_url: { type: string, format: uri }
        thumbnail_url: { type: ["string", "null"], format: uri }
    FilmmakerImageUpload:
      type: object
      additionalProperties: false
      required: [kind, image_url]
      properties:
        kind: { type: string, enum: [poster, share] }
        image_url: { type: string, format: uri }
    PublicProject:
      type: object
      additionalProperties: false
      required: [slug, title, format, genre, stage, logline, synopsis, team_links, money_use, distribution_plan, trailer_url, trailer_thumbnail_url, poster_url, confirmed_pledge_total, approved, showcase_requested, phone_verified]
      properties:
        slug: { type: string }
        title: { type: string }
        format: { type: ["string", "null"] }
        genre: { type: ["string", "null"] }
        stage: { type: ["string", "null"] }
        logline: { type: ["string", "null"] }
        synopsis: { type: ["string", "null"] }
        team_links:
          type: array
          items: { type: string }
        money_use: { type: ["string", "null"] }
        distribution_plan: { type: ["string", "null"] }
        trailer_url: { type: ["string", "null"], format: uri }
        trailer_thumbnail_url: { type: ["string", "null"], format: uri }
        poster_url: { type: ["string", "null"], format: uri }
        confirmed_pledge_total: { type: number, minimum: 0 }
        approved: { type: boolean }
        showcase_requested: { type: boolean }
        phone_verified: { type: boolean }
    FlowProgress:
      type: object
      required: [flow, last_screen, answers, completed, updated_at]
      properties:
        flow:
          $ref: "#/components/schemas/Flow"
        draft_id: { type: integer, minimum: 1 }
        last_screen: { type: integer }
        answers:
          type: object
          additionalProperties: true
        completed: { type: boolean }
        updated_at: { type: string, format: date-time }
    AdminIdentity:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role: { type: string, enum: [admin] }
    AdminSection:
      type: string
      enum: [summary, pledges, location, funnels, market, price-test, queues, messages, channels, email-log]
    AdminTable:
      type: object
      required: [section, title, columns, rows, total]
      properties:
        section:
          $ref: "#/components/schemas/AdminSection"
        title: { type: string }
        columns:
          type: array
          items: { type: string }
        rows:
          type: array
          items:
            type: array
            items: { type: string }
        total: { type: integer, minimum: 0 }
    AdminProjectReviewInput:
      type: object
      properties:
        approved: { type: boolean }
        hidden: { type: boolean }
    AdminProjectReview:
      type: object
      required: [id, approved, hidden]
      properties:
        id: { type: integer }
        approved: { type: boolean }
        hidden: { type: boolean }
    AdminMessageReviewInput:
      type: object
      required: [hidden]
      properties:
        hidden: { type: boolean }
    AdminMessageReview:
      type: object
      required: [id, hidden]
      properties:
        id: { type: integer }
        hidden: { type: boolean }

