      properties:
        team_info: { type: string, maxLength: 3000 }
        team_links: { type: array, maxItems: 10, items: { type: string, format: uri, maxLength: 2048 } }
        money_use: { type: string, maxLength: 5000 }
        distribution_plan: { type: string, maxLength: 5000 }
        crowdfunding_ran: { type: boolean }
        crowdfunding_campaign: { type: string, maxLength: 2000 }
        crowdfunding_same_project: { type: boolean }
        crowdfunding_goal: { type: number, minimum: 0, maximum: 2147483647 }
        crowdfunding_raised: { type: number, minimum: 0, maximum: 2147483647 }
